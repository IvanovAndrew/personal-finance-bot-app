<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <title>LEO VET — approximate vector recreation</title>
  <rect width="900" height="900" fill="#191b29"/>

  <!-- Leopard silhouette, simplified from the supplied low-resolution logo -->
  <g fill="#b58a62" stroke="#b58a62" stroke-linejoin="round">
    <!-- body -->
    <path d="M282 365
             C302 328 337 303 382 296
             C425 289 474 296 510 313
             C536 325 557 329 579 320
             C600 311 618 296 637 297
             C653 298 664 309 665 324
             C666 337 658 347 647 352
             C638 356 628 353 620 349
             C604 342 590 346 578 357
             C565 369 554 382 537 390
             C515 400 486 397 462 390
             C439 383 419 377 396 378
             C369 379 347 389 329 402
             C312 414 292 410 281 397
             C274 388 275 376 282 365Z"/>
    <!-- head / muzzle -->
    <path d="M625 301
             C636 281 653 267 675 264
             C691 262 707 269 714 281
             C720 291 718 305 710 314
             C703 322 692 325 680 322
             L663 318 L647 326 L632 321Z"/>
    <!-- ears -->
    <path d="M651 273 L649 250 C650 241 657 238 665 244 L680 262Z"/>
    <path d="M686 264 L699 245 C705 239 713 244 713 252 L709 275Z"/>
    <!-- front leg -->
    <path d="M543 381 C557 378 569 383 572 395 L570 447
             C570 457 564 463 554 463 L539 463
             C532 462 529 456 532 449 L539 426 L536 397Z"/>
    <!-- rear leg -->
    <path d="M354 385 C367 382 379 387 381 399 L373 447
             C371 458 364 463 354 462 L339 461
             C332 460 330 454 333 447 L344 423 L344 398Z"/>
    <!-- rear leg / haunch -->
    <path d="M311 370 C296 383 286 405 292 423
             C296 435 307 439 317 433 L331 411 L341 386Z"/>
    <!-- tail -->
    <path d="M301 374
             C278 359 257 350 245 333
             C238 323 239 312 246 308
             C254 304 261 309 266 319
             C276 337 294 345 316 349Z"/>
  </g>

  <!-- restrained spots -->
  <g fill="#5d4635" opacity=".8">
    <circle cx="337" cy="337" r="7"/><circle cx="358" cy="323" r="6"/>
    <circle cx="382" cy="335" r="7"/><circle cx="407" cy="320" r="6"/>
    <circle cx="430" cy="337" r="7"/><circle cx="454" cy="329" r="6"/>
    <circle cx="478" cy="345" r="7"/><circle cx="501" cy="337" r="6"/>
    <circle cx="526" cy="353" r="6"/><circle cx="552" cy="344" r="5"/>
    <circle cx="367" cy="355" r="5"/><circle cx="397" cy="349" r="5"/>
    <circle cx="444" cy="356" r="5"/><circle cx="486" cy="363" r="5"/>
  </g>

  <!-- baseline -->
  <rect x="238" y="467" width="424" height="7" rx="3.5" fill="#a88970"/>

  <!-- Main wordmark -->
  <text x="450" y="555"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="142"
        letter-spacing="2"
        fill="#f2f0e9">LEO VET</text>

  <!-- Subtitle -->
  <text x="450" y="604"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="5"
        fill="#f2f0e9">ANIMAL MEDICAL CENTER</text>
</svg>
